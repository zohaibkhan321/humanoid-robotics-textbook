version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - COHERE_API_KEY=${COHERE_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - NEON_CONN=${NEON_CONN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - .:/app
    env_file:
      - .env
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000